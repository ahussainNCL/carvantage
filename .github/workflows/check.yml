name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@8 "*.html"
      - name: Check internal links
        run: |
          python3 -m http.server 8080 &
          sleep 1
          npx --yes linkinator@6 http://localhost:8080/ --recurse --skip "^(https?://(fonts|www\.gov\.uk|wa\.me|instagram\.com)|mailto:|tel:)" --verbosity error
