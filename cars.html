<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F4F2">
<title>Cars for sale · Carvantage</title>
<meta name="description" content="Browse our used cars by budget, type, fuel and gearbox. Every car history checked and listed with its faults.">
<link rel="canonical" href="https://carvantage.uk/cars.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Carvantage">
<meta property="og:title" content="Cars for sale · Carvantage">
<meta property="og:description" content="Browse our used cars by budget, type, fuel and gearbox. Every car history checked and listed with its faults.">
<meta property="og:url" content="https://carvantage.uk/cars.html">
<meta property="og:image" content="https://carvantage.uk/assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/sora.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-head"></header>
<main class="section tight">
  <div class="wrap">
    <div class="sec-head">
      <div><p class="eyebrow">Find your next car</p><h1>Cars for sale</h1><p>History checked. Faults listed. MOT date shown on every car.</p></div>
      <a class="link arrow" href="sell.html?px=1">Have a car to part exchange?</a>
    </div>
    <div class="filterbar" id="filters">
      <div class="stock-search"><label class="sr-only" for="fSearch">Search by make, model or trim</label><input class="input" type="search" id="fSearch" placeholder="Search by make, model or trim…" autocomplete="off" maxlength="100"><button class="clear-filters" id="resetFilters" type="button" hidden>Clear filters</button></div>
      <details class="filter-disclosure" id="filterDisclosure" open>
      <summary>Refine your search <span aria-hidden="true">+</span></summary>
      <div class="filter-fields">
      <div class="row">
        <div class="group"><label for="fBudget"><span>Budget</span></label>
          <select class="select" id="fBudget" data-budget></select>
        </div>
        <div class="group" data-filter="body" role="group" aria-label="Type of car"><span>Type</span>
          <button class="chip" type="button" aria-pressed="true" data-v="">Any</button>
          <button class="chip" type="button" aria-pressed="false" data-v="Hatchback">Hatchback</button>
          <button class="chip" type="button" aria-pressed="false" data-v="Estate">Estate</button>
          <button class="chip" type="button" aria-pressed="false" data-v="SUV">SUV</button>
          <button class="chip" type="button" aria-pressed="false" data-v="MPV">People carrier</button>
        </div>
      </div>
      <div class="row">
        <div class="group" data-filter="fuel" role="group" aria-label="Fuel"><span>Fuel</span>
          <button class="chip" type="button" aria-pressed="true" data-v="">Any</button>
          <button class="chip" type="button" aria-pressed="false" data-v="Petrol">Petrol</button>
          <button class="chip" type="button" aria-pressed="false" data-v="Diesel">Diesel</button>
        </div>
        <div class="group" data-filter="gearbox" role="group" aria-label="Gearbox"><span>Gearbox</span>
          <button class="chip" type="button" aria-pressed="true" data-v="">Any</button>
          <button class="chip" type="button" aria-pressed="false" data-v="Manual">Manual</button>
          <button class="chip" type="button" aria-pressed="false" data-v="Automatic">Automatic</button>
        </div>
      </div>
      </div>
      </details>
      <div class="active-filters" id="activeFilters" role="group" aria-label="Selected filters" hidden></div>
      <div class="meta">
        <p id="count" aria-live="polite" class="muted"></p>
        <label class="sort">Sort
          <select class="select" id="sort">
            <option value="new">Newest listed</option>
            <option value="price-asc">Price, low to high</option>
            <option value="price-desc">Price, high to low</option>
            <option value="miles">Lowest mileage</option>
            <option value="year">Newest year</option>
          </select>
        </label>
      </div>
    </div>
    <h2 class="sr-only">Our current stock</h2>
    <div class="car-grid" id="grid"></div>
    <div class="sold-strip" id="soldStrip" hidden>
      <h3>Recently sold</h3>
      <p class="muted small" style="margin-bottom:var(--s3)">Sold recently. Message us if you want something similar and we'll tell you when one comes in.</p>
      <div class="row" id="soldRow"></div>
    </div>
  </div>
</main>
<footer id="site-foot"></footer>
<script src="assets/js/cars.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/stock.js"></script>
</body>
</html>
