<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1013">
<title>Cars for sale · Carvantage</title>
<meta name="description" content="Browse our used cars by budget, type, fuel and gearbox. Every car history checked and listed with its faults.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-head"></header>
<main>
  <div class="wrap page-head">
    <div><p class="eyebrow">Stock</p><h1>Cars for sale</h1></div>
    <p>Every car is history checked and listed with its faults. Tap a car for the full story.</p>
  </div>
  <div class="filterbar" id="filters">
    <div class="wrap">
      <div class="filters" role="group" aria-label="Filters">
        <label class="f"><span>Budget</span>
          <select class="select" id="fBudget">
            <option value="">Any price</option>
            <option value="2000">Up to £2,000</option>
            <option value="3000">Up to £3,000</option>
            <option value="4000">Up to £4,000</option>
            <option value="5000">Up to £5,000</option>
          </select>
        </label>
        <label class="f"><span>Type</span>
          <select class="select" id="fBody">
            <option value="">Any type</option>
            <option value="Hatchback">Hatchback</option>
            <option value="Estate">Estate</option>
            <option value="SUV">SUV</option>
            <option value="MPV">People carrier</option>
          </select>
        </label>
        <label class="f"><span>Fuel</span>
          <select class="select" id="fFuel">
            <option value="">Any fuel</option>
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
          </select>
        </label>
        <label class="f"><span>Gearbox</span>
          <select class="select" id="fGearbox">
            <option value="">Any gearbox</option>
            <option value="Manual">Manual</option>
            <option value="Automatic">Automatic</option>
          </select>
        </label>
        <button class="btn ghost sm" type="button" id="clearBtn" hidden>Clear</button>
      </div>
      <div class="results">
        <p id="count" aria-live="polite"></p>
        <label class="sort" for="sort">Sort
          <select class="select" id="sort">
            <option value="new">Newest listed</option>
            <option value="price-asc">Price, low to high</option>
            <option value="price-desc">Price, high to low</option>
            <option value="miles">Lowest mileage</option>
            <option value="year">Newest year</option>
          </select>
        </label>
      </div>
    </div>
  </div>
  <div class="wrap section tight">
    <div class="car-grid" id="grid"></div>
    <div class="sold-strip" id="soldStrip" hidden>
      <h3>Recently sold</h3>
      <p class="muted small">Gone, but it shows the kind of thing we get in. Message us and we'll tell you when something similar arrives.</p>
      <div class="row" id="soldRow"></div>
    </div>
  </div>
</main>
<footer id="site-foot"></footer>
<script src="assets/js/cars.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/stock.js"></script>
</body>
</html>
